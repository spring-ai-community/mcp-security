spring.application.name=sample-mcp-client-modern
server.port=8082

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-sonnet-4-6

spring.ai.mcp.client.streamable-http.connections.current-weather.url=http://localhost:8093
# Speak the 2026-07-28 ("modern") protocol revision with this server
spring.ai.mcp.client.streamable-http.connections.current-weather.protocol=MODERN
spring.ai.mcp.client.type=SYNC

spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.authorization.allow-loopback-addresses=true
spring.ai.mcp.client.authorization.dynamic-client-registration.enabled=true
