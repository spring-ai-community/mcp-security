spring.application.name=sample-mcp-server-modern
server.port=${PORT:8093}
server.servlet.session.cookie.name=MCP_SERVER_MODERN_SESSIONID
spring.ai.mcp.server.name=mcp-server-weather-modern
# Serve the 2026-07-28 ("modern") protocol revision
spring.ai.mcp.server.protocol=MODERN

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI:http://localhost:9000}

logging.level.org.springframework.security=TRACE
